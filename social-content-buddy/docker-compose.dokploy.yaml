version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Database — connects to internal db service
      DATABASE_URL: postgresql://scb_user:${DB_PASSWORD}@scb-db:5432/social_content_buddy
      # Auth
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: "true"
      # Encryption key for BYOK API key storage (AES-256-GCM)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Cloudflare R2 image storage
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network   # Traefik reverse proxy (domain routing)
      - internal          # Private network to db (no external access)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_content_buddy
      POSTGRES_USER: scb_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      internal:
        aliases:
          - scb-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scb_user -d social_content_buddy"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dokploy-network:
    external: true        # Must exist on the Hetzner server (it does)
  internal:
    driver: bridge        # Private bridge — app <-> db only

volumes:
  db_data:               # Persistent PostgreSQL data
