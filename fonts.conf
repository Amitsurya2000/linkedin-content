<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig file for the Vercel / AWS Lambda runtime.

  Vercel serverless functions run in /var/task with no installed fonts, so
  librsvg (used by sharp) silently drops SVG <text> and carousels come out as
  bare backgrounds. next.config.ts traces the Poppins TTFs (and this file) into
  every function, and setting FONTCONFIG_PATH=/var/task (or the instrumentation
  hook in src/instrumentation.ts) makes fontconfig find them here.

  The cache dir is on /tmp because the Lambda filesystem is read-only apart
  from it; without a writable cachedir fontconfig aborts even if the fonts dir
  is correct.
-->
<fontconfig>
  <dir>/var/task/assets/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>